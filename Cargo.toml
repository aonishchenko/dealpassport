[workspace]
resolver = "2"
members = ["contracts/groth16-verifier", "contracts/eligibility-gate", "contracts/deal-gate"]

[workspace.dependencies]
soroban-sdk = "28"

[profile.release]
opt-level = "z"
overflow-checks = true
debug = 0
strip = "symbols"
debug-assertions = false
panic = "abort"
codegen-units = 1
lto = true
