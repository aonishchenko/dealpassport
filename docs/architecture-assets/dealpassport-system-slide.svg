<svg xmlns="http://www.w3.org/2000/svg" width="2200" height="740" viewBox="0 0 2200 740" role="img" aria-label="Deal Passport production target architecture"><title>Deal Passport production architecture</title><desc>React interface connects to a Cloudflare verification backend. External identity, funds and property services provide evidence. Private ZK proofs feed Stellar Soroban contracts. Candidate providers and proving libraries remain subject to selection.</desc><rect width="2200" height="740" fill="#F7F6F2"/><defs><marker id="arrow" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M 1 1 L 10 6 L 1 11" fill="none" stroke="#343B42" stroke-width="2"/></marker></defs><polyline points="350,442 480,442" fill="none" stroke="#343B42" stroke-width="3" marker-end="url(#arrow)"/><polyline points="930,195 930,290" fill="none" stroke="#343B42" stroke-width="3" marker-end="url(#arrow)"/><polyline points="1380,350 1440,350 1440,125 1520,125" fill="none" stroke="#343B42" stroke-width="3" marker-end="url(#arrow)"/><polyline points="1840,230 1840,330" fill="none" stroke="#343B42" stroke-width="3" marker-end="url(#arrow)"/><polyline points="1380,510 1520,510" fill="none" stroke="#343B42" stroke-width="3" marker-end="url(#arrow)" marker-start="url(#arrow)"/><rect x="40" y="320" width="310" height="245" rx="12" fill="#F2F4F7" stroke="#63748B" stroke-width="2.5"/><rect x="480" y="20" width="900" height="175" rx="12" fill="#EDF4FB" stroke="#396B9B" stroke-width="2.5"/><rect x="480" y="290" width="900" height="350" rx="12" fill="#FFF5E8" stroke="#B97122" stroke-width="2.5"/><rect x="1520" y="20" width="640" height="210" rx="12" fill="#F2EEFA" stroke="#7653A7" stroke-width="2.5"/><rect x="1520" y="330" width="640" height="310" rx="12" fill="#EDF5EF" stroke="#397552" stroke-width="2.5"/><text x="65" y="384" font-family="Instrument Sans,Arial,sans-serif" font-size="34" font-weight="700" fill="#182028">React interface</text><text x="65" y="441" font-family="Instrument Sans,Arial,sans-serif" font-size="27" font-weight="400" fill="#182028">Buyer / seller / issuer</text><text x="65" y="484" font-family="Instrument Sans,Arial,sans-serif" font-size="27" font-weight="400" fill="#182028">User wallet signing</text><text x="65" y="527" font-family="Instrument Sans,Arial,sans-serif" font-size="27" font-weight="400" fill="#182028">Private deal room</text><text x="510" y="76" font-family="Instrument Sans,Arial,sans-serif" font-size="34" font-weight="700" fill="#182028">External verification services</text><text x="510" y="120" font-family="Instrument Sans,Arial,sans-serif" font-size="28" font-weight="700" fill="#182028">Identity</text><text x="510" y="154" font-family="Instrument Sans,Arial,sans-serif" font-size="26" font-weight="400" fill="#182028">Didit or Stripe Identity</text><text x="800" y="120" font-family="Instrument Sans,Arial,sans-serif" font-size="28" font-weight="700" fill="#182028">Funds</text><text x="800" y="154" font-family="Instrument Sans,Arial,sans-serif" font-size="26" font-weight="400" fill="#182028">Bank / open banking</text><text x="1080" y="120" font-family="Instrument Sans,Arial,sans-serif" font-size="28" font-weight="700" fill="#182028">Property authority</text><text x="1080" y="154" font-family="Instrument Sans,Arial,sans-serif" font-size="26" font-weight="400" fill="#182028">Registry + legal reviewer</text><text x="510" y="190" font-family="Instrument Sans,Arial,sans-serif" font-size="25" font-weight="400" fill="#182028">Candidates: Reclaim evidence / ACTA credentials</text><text x="510" y="350" font-family="Instrument Sans,Arial,sans-serif" font-size="36" font-weight="700" fill="#182028">Cloudflare backend</text><text x="510" y="393" font-family="Instrument Sans,Arial,sans-serif" font-size="28" font-weight="400" fill="#182028">Workers API / issuer adapters / access control</text><text x="510" y="455" font-family="Instrument Sans,Arial,sans-serif" font-size="29" font-weight=