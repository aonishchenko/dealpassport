<svg xmlns="http://www.w3.org/2000/svg" width="2200" height="710" viewBox="0 0 2200 710" role="img" aria-labelledby="title desc"><title id="title">Deal Passport implemented architecture</title><desc id="desc">Implemented Deal Passport MVP. React buyer and seller personas use a browser snarkjs Groth16 prover. Cloudflare Worker authenticates each private synthetic session, reads secrets and stores hashed sessions and operation receipts in D1. On Stellar Testnet, EligibilityGate checks the proof using the BN254 verifier, while DealGate checks current buyer eligibility, issuer-authorized property marketing authority and both consents. Only the Worker API returns the protected synthetic dossier. Balances, documents and access secrets are not put onchain. Real identity/property providers are post-MVP.</desc><style>text{font-family:"Instrument Sans",Inter,Arial,sans-serif}</style><defs><marker id="arrow" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="m1 1 10 5-10 5" fill="none" stroke="context-stroke" stroke-width="2"/></marker></defs><rect x="20" y="0" width="430" height="650" rx="18" fill="#eef5fb" stroke="#b9d3e8" stroke-width="2"/><text x="42" y="46" font-size="28" font-weight="800" fill="#174b76">BROWSER</text><rect x="505" y="0" width="600" height="650" rx="18" fill="#fff4e8" stroke="#ecc9a1" stroke-width="2"/><text x="527" y="46" font-size="28" font-weight="800" fill="#a75a15">CLOUDFLARE</text><rect x="1160" y="0" width="600" height="650" rx="18" fill="#f2effa" stroke="#cfc1e7" stroke-width="2"/><text x="1182" y="46" font-size="28" font-weight="800" fill="#694596">STELLAR TESTNET</text><rect x="1815" y="0" width="365" height="650" rx="18" fill="#edf6ef" stroke="#b9d5bf" stroke-width="2"/><text x="1837" y="46" font-size="28" font-weight="800" fill="#246443">PRIVATE OUTPUT</text><path d="M430 320H525" fill="none" stroke="#174b76" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><path d="M1085 180H1180" fill="none" stroke="#694596" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><path d="M1085 280H1130V540H1180" fill="none" stroke="#694596" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" marker-start="url(#arrow)" marker-end="url(#arrow)"/><path d="M1085 350H1118V682H1788V350H1835" fill="none" stroke="#246443" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><text x="1250" y="671" font-size="22" font-weight="700" fill="#246443">Fresh status / gated API response</text><path d="M655 394V421" fill="none" stroke="#a75a15" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><path d="M945 421V394" fill="none" stroke="#a75a15" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><path d="M1460 268V300" fill="none" stroke="#694596" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><path d="M1740 500H1750V140H1740" fill="none" stroke="#694596" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><rect x="40" y="94" width="390" height="130" rx="12" fill="#fff" stroke="#d8d5cb" stroke-width="2"/><g transform="translate(78 134) scale(0.7)" fill="none" stroke="#174b76" stroke-width="3.8" stroke-linecap="round" stroke-linejoin="round"><rect x="-24" y="-18" width="48" height="36" rx="4"/><path d="M-24-7h48M-16-12h1m6 0h1"/></g><text x="115" y="143" font-size="30" font-weight="750" fill="#174b76">React interface</text><text x="64" y="185" font-size="24" font-weight="500" fill="#4e514e">Buyer · Seller · Issuer · Judge</text><rect x="40" y="244" width="390" height="220" rx="12" fill="#fff" stroke="#d8d5cb" stroke-width="2"/><g transform="translate(80 286) scale(0.72)" fill="none" stroke="#174b76" stroke-width="3.8" stroke-linecap="round" stroke-linejoin="round"><path d="M0-27 24-17v23C24 20 0 31 0 31S-24 20-24 6v-23Z"/><path d="m-12 1 8 8 18-20"/></g><text x="117" y="294" font-size="30" font-weight="750" fill="#174b76">Browser prover</text><text x="64" y="340" font-size="24" font-weight="500" fill="#4e514e">snarkjs · Groth16 · BN254</text><text x="64" y="373" font-size="24" font-weight="500" fill="#4e514e">Threshold + issuer membership</text><text x="64" y="406" font-size="24" font-weight="500" fill="#4e514e">Expiry + deal + recipient binding</text><text x="64" y="439" font-size="24" font-weight="500" fill="#4e514e">Proof and public inputs → API</text><rect x="40" y="485" width="390" height="145" rx="12" fill="#e1edf6" stroke="#b9d3e8" stroke-width="2"/><text x="64" y="524" font-size="30" font-weight="750" fill="#174b76">Private witness</text><text x="64" y="561" font-size="24" font-weight="500" fill="#4e514e">Synthetic balance, secret and</text><text x="64" y="595" font-size="24" font-weight="500" fill="#4e514e">Merkle path stay offchain</text><rect x="525" y="94" width="560" height="300" rx="12" fill="#fff" stroke="#d8d5cb" stroke-width="2"/><g transform="translate(565 135) scale(0.65)" fill="none" stroke="#a75a15" stroke-width="3.8" stroke-linecap="round" stroke-linejoin="round"><path d="M-23 18h45c12 0 18-7 18-16 0-10-8-17-18-16C14-40-17-38-23-14-43-16-47 16-23 18Z"/></g><text x="605" y="143" font-size="30" font-weight="750" fill="#a75a15">Worker API</text><text x="550" y="191" font-size="25" font-weight="500" fill="#4e514e">Creates the private demo deal</text><text x="550" y="225" font-size="25" font-weight="500" fill="#4e514e">HttpOnly session + CSRF protection</text><text x="550" y="259" font-size="25" font-weight="500" fill="#4e514e">Submits authenticated Testnet actions</text><text x="550" y="293" font-size="25" font-weight="500" fill="#4e514e">Checks fresh DealGate status</text><text x="550" y="327" font-size="25" font-weight="500" fill="#4e514e">Returns dossier only when all checks pass</text><text x="550" y="361" font-size="25" font-weight="500" fill="#4e514e">Serializes shared demo signer operations</text><rect x="525" y="421" width="260" height="210" rx="12" fill="#fff" stroke="#d8d5cb" stroke-width="2"/><g transform="translate(565 462) scale(0.65)" fill="none" stroke="#a75a15" stroke-width="3.8" stroke-linecap="round" stroke-linejoin="round"><ellipse cy="-14" rx="24" ry="8"/><path d="M-24-14v28c0 4 11 8 24 8s24-4 24-8v-28M-24 0c0 4 11 8 24 8s24-4 24-8"/></g><text x="607" y="470" font-size="30" font-weight="750" fill="#a75a15">D1</text><text x="548" y="519" font-size="24" font-weight="500" fill="#4e514e">Hashed sessions</text><text x="548" y="555" font-size="24" font-weight="500" fill="#4e514e">Receipts + progress</text><text x="548" y="591" font-size="24" font-weight="500" fill="#4e514e">Session-private logs</text><rect x="805" y="421" width="280" height="210" rx="12" fill="#fff" stroke="#d8d5cb" stroke-width="2"/><g transform="translate(846 461) scale(0.65)" fill="none" stroke="#a75a15" stroke-width="3.8" stroke-linecap="round" stroke-linejoin="round"><rect x="-22" y="-2" width="44" height="30" rx="4"/><path d="M-14-2v-13a14 14 0 0 1 28 0v13M0 10v7"/></g><text x="883" y="470" font-size="30" font-weight="750" fill="#a75a15">Secrets</text><text x="828" y="519" font-size="23" font-weight="500" fill="#4e514e">Synthetic issuer bundle</text><text x="828" y="555" font-size="23" font-weight="500" fill="#4e514e">Disposable Testnet keys</text><text x="828" y="591" font-size="23" font-weight="500" fill="#4e514e">Never public assets</text><rect x="1180" y="94" width="560" height="174" rx="12" fill="#fff" stroke="#d8d5cb" stroke-width="2"/><text x="1205" y="136" font-size="30" font-weight="750" fill="#694596">EligibilityGate</text><text x="1205" y="180" font-size="24" font-weight="500" fill="#4e514e">Authorized issuer root + exact deal policy</text><text x="1205" y="212" font-size="24" font-weight="500" fill="#4e514e">Current epoch + recipient + unused nullifier</text><text x="1205" y="244" font-size="24" font-weight="500" fill="#4e514e">Buyer qualification expires within 5 minutes</text><rect x="1180" y="300" width="560" height="100" rx="12" fill="#fff" stroke="#d8d5cb" stroke-width="2"/><text x="1205" y="341" font-size="30" font-weight="750" fill="#694596">BN254 Groth16 verifier</text><text x="1205" y="375" font-size="24" font-weight="500" fill="#4e514e">Pinned verification key · genuine proof check</text><rect x="1180" y="432" width="560" height="198" rx="12" fill="#fff" stroke="#d8d5cb" stroke-width="2"/><text x="1205" y="476" font-size="30" font-weight="750" fill="#694596">DealGate</text><text x="1205" y="518" font-size="24" font-weight="500" fill="#4e514e">Issuer-authenticated marketing authority</text><text x="1205" y="549" font-size="24" font-weight="500" fill="#4e514e">Reads current buyer qualification</text><text x="1205" y="580" font-size="24" font-weight="500" fill="#4e514e">Requires buyer + seller consent</text><text x="1205" y="611" font-size="24" font-weight="500" fill="#4e514e">Withdrawal / revocation lock fresh access</text><rect x="1835" y="94" width="325" height="315" rx="12" fill="#fff" stroke="#d8d5cb" stroke-width="2"/><g transform="translate(1998 154) scale(1)" fill="none" stroke="#246443" stroke-width="3.8" stroke-linecap="round" stroke-linejoin="round"><path d="m-28 0 28-24L28 0M-21-6v32H21V-6M-7 26V7H7v19"/></g><text x="1857" y="226" font-size="30" font-weight="750" fill="#246443">Protected dossier</text><text x="1857" y="273" font-size="23" font-weight="500" fill="#4e514e">Fictional property address</text><text x="1857" y="310" font-size="23" font-weight="500" fill="#4e514e">Seller + authority document</text><text x="1857" y="347" font-size="23" font-weight="500" fill="#4e514e">Returned by Worker API</text><text x="1857" y="384" font-size="23" font-weight="500" fill="#4e514e">Only after fresh approval</text><rect x="1835" y="450" width="325" height="180" rx="12" fill="#e2f0e5" stroke="#b9d5bf" stroke-width="2"/><text x="1857" y="490" font-size="30" font-weight="750" fill="#246443">Implemented MVP</text><text x="1857" y="532" font-size="23" font-weight="500" fill="#4e514e">Synthetic issuers / property</text><text x="1857" y="566" font-size="23" font-weight="500" fill="#4e514e">Real Stellar verification</text><text x="1857" y="600" font-size="23" font-weight="500" fill="#4e514e">Real providers: post-MVP</text></svg>