[package]
name = "eligibility-gate"
version = "0.1.0"
edition = "2024"
publish = false

[lib]
crate-type = ["lib", "cdylib"]
doctest = false

[dependencies]
soroban-sdk = { workspace = true }

[dev-dependencies]
soroban-sdk = { workspace = true, features = ["testutils"] }
groth16-verifier = { path = "../groth16-verifier" }
serde_json = "1"
num-bigint = "0.4"
